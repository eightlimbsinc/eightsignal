[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Next.js runtime is provided automatically by Netlify (OpenNext adapter,
# @netlify/plugin-nextjs v5). Pin it explicitly to control upgrades:
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
